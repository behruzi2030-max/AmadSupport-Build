name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build application
        shell: pwsh
        run: |
          $args = @(
            "--noconfirm",
            "--clean",
            "--name=AmadSupport",
            "--windowed",
            "--onedir",
            "--collect-all=kivy",
            "--collect-all=arabic_reshaper",
            "--collect-all=bidi"
          )
          if (Test-Path "NotoNaskhArabic-Regular.ttf") {
            $args += @("--add-data", "NotoNaskhArabic-Regular.ttf;.")
          }
          if (Test-Path "NotoNaskhArabic-Bold.ttf") {
            $args += @("--add-data", "NotoNaskhArabic-Bold.ttf;.")
          }
          python -m PyInstaller @args main.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Persian installer
        shell: pwsh
        run: |
          $compiler = "$env:ProgramFiles(x86)\\Inno Setup 6\\ISCC.exe"
          if (!(Test-Path $compiler)) { throw "Inno Setup compiler was not found at $compiler" }
          & $compiler "installer/AmadSupport.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package portable Windows build
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/AmadSupport/*" -DestinationPath "AmadSupport-Windows-x64.zip" -Force

      - name: Upload Windows installer and portable build
        uses: actions/upload-artifact@v4
        with:
          name: AmadSupport-Windows-x64
          path: |
            dist-installer/AmadSupport-Setup-x64.exe
            AmadSupport-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

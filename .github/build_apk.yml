```yaml
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            openjdk-17-jdk \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential

      - name: Check Java
        run: |
          java -version
          javac -version

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade buildozer
          python -m pip install "cython<3"

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Show generated files
        if: always()
        run: |
          echo "Generated APK/AAB files:"
          find . -type f \( -name "*.apk" -o -name "*.aab" \) -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AmadSupport-APK
          path: bin/*.apk
          if-no-files-found: error
```
